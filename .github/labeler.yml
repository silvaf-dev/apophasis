# Core source code
core:
  - "src/**"

# Tests (Playwright + test artifacts)
tests:
  - "tests/**"
  - "playwright.config.ts"

# CI/CD workflows
ci:
  - ".github/workflows/**"

# Documentation
docs:
  - "README.md"
  - "LICENSE"
  - "*.md"
  - "docs/**"

# Config files
config:
  - "tsconfig.json"
  - "package.json"
  - "package-lock.json"
  - ".gitignore"
  - ".npmignore"

# Assets
assets:
  - "*.gif"