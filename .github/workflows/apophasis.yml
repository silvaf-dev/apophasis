name: Apophasis Mutation Testing

on:
  pull_request:

jobs:
  apophasis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Clone Apophasis
        run: git clone https://github.com/silvaf-dev/apophasis.git

      - name: Install Playwright
        run: npx playwright install

      - name: Build Apophasis
        working-directory: ./apophasis
        run: npm install && npm run build

      - name: Install Apophasis locally
        run: npm install ./apophasis

      - name: Run Apophasis
        run: |
          npx apophasis | tee apophasis.log

      - name: Enforce strict mutation policy
        run: |
          survivors=$(grep -Eo "Survived:\s*[0-9]+" apophasis.log | grep -Eo "[0-9]+")

          if [ "$survivors" = "9" ]; then
            echo "✅ Mutation testing passed: exactly 9 survivors"
          else
            echo "❌ Mutation testing failed: expected 9 survivors, got ${survivors:-0}"
            exit 1
          fi