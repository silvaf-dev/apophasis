name: Apophasis Mutation Testing

on:
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install clean Playwright
        run: npx playwright install

      - name: Run Playwright regularly
        run: npx playwright test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/index.html
          if-no-files-found: warn

  apophasis:
    runs-on: ubuntu-latest
    needs: playwright # finish first job before tackling this one
    steps:
      - name: Checkout project repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install

      - name: Install & build Apophasis (local workspace)
        working-directory: ./apophasis
        run: |
          npm ci
          npm run build

      - name: Run Apophasis with baseline Playwright
        run: |
          node ./apophasis/dist/bin.js --baseline | tee apophasis.log

      - name: Enforce strict mutation policy
        run: |
          if grep -Fxq "💀 Killed: 10 | 🛡️ Survived: 3" apophasis.log; then
            echo "✅ Mutation testing passed: exact result matched"
          else
            echo "❌ Mutation testing failed: expected '💀 Killed: 10 | 🛡️ Survived: 3'"
            echo "Actual summary:"
            grep -E "💀 Killed:" apophasis.log || echo "No summary line found"
            exit 1
          fi

      - name: Upload mutation report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apophasis-report
          path: apophasis-report/apophasis-report.html
          if-no-files-found: warn