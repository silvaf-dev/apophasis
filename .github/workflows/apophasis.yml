name: Apophasis Mutation Testing

on:
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install clean Playwright
        run: npx playwright install

      - name: Run Playwright regularly
        run: npx playwright test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/index.html
          if-no-files-found: warn

  apophasis:
    runs-on: ubuntu-latest
    needs: playwright # first job must succeed before tackling this one
    steps:
      - name: Checkout project repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install

      - name: Build Apophasis
        run: npm run build

      - name: Run Apophasis with baseline Playwright
        run: |
          node ./dist/bin.js --baseline | tee apophasis.log

      - name: Enforce strict mutation policy
        run: |
          killed=$(grep -A1 "💀 Killed Mutants" apophasis.log | tail -n1 | xargs)
          survived=$(grep -A1 "🛡️ Survived Mutants" apophasis.log | tail -n1 | xargs)

          if [[ "$killed" == "10" && "$survived" == "3" ]]; then
            echo "✅ Testing the tester of tests (Apophasis) passed."
            echo "Killed: $killed | Survived: $survived"
          else
            echo "❌ Testing the tester of tests (Apophasis) failed."
            echo "Killed: $killed | Survived: $survived"
            exit 1
          fi

      - name: Upload mutation report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apophasis-report
          path: apophasis-report/apophasis-report.html
          if-no-files-found: warn