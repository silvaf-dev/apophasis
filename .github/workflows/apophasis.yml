name: Apophasis Mutation Testing

on:
  pull_request:

jobs:
  apophasis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Clone Apophasis
        run: git clone https://github.com/silvaf-dev/apophasis.git

      - name: Install Playwright
        run: npx playwright install

      - name: Build Apophasis
        working-directory: ./apophasis
        run: npm install && npm run build

      - name: Install Apophasis locally
        run: npm install ./apophasis

      - name: Run Apophasis
        run: |
          npx apophasis | tee apophasis.log

      - name: Enforce strict mutation policy
        run: |
          if grep -Fxq "💀 Killed: 10 | 🛡️ Survived: 3" apophasis.log; then
            echo "✅ Mutation testing passed: exact result matched"
          else
            echo "❌ Mutation testing failed: expected '💀 Killed: 10 | 🛡️ Survived: 3'"
            echo "Actual summary:"
            grep -E "💀 Killed:" apophasis.log || echo "No summary line found"
            exit 1
          fi

      - name: Upload mutation report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apophasis-report
          path: apophasis-report/apophasis-report.html
          if-no-files-found: warn