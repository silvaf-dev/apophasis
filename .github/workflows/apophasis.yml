name: Apophasis Mutation Testing

on:
  push:
  pull_request:

jobs:
  apophasis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Clone Apophasis
        run: git clone https://github.com/silvaf-dev/apophasis.git

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Build Apophasis
        working-directory: ./apophasis
        run: npm install && npm run build

      - name: Run Apophasis
        run: |
          npx apophasis | tee apophasis.log

      - name: Enforce strict mutation policy
        run: |
          if grep -Eq "Survived:\s*[1-9]" apophasis.log; then
            echo "❌ Mutation testing failed: surviving mutants detected"
            exit 1
          else
            echo "✅ Mutation testing passed: zero survivors"
          fi